<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2a5a"/>
      <stop offset="100%" stop-color="#111836"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3dc9d"/>
      <stop offset="50%" stop-color="#d4b45d"/>
      <stop offset="100%" stop-color="#b8933b"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3dc9d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b8933b" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="15" fill="url(#navyBg)"/>
  
  <!-- Refined Border -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="none" stroke="url(#goldBorder)" stroke-width="1.5"/>

