    <!-- Small matching companion 'e' -->
    <path d="M 44.5 37 C 42 37 40 39.2 39.8 42.5 C 41.5 42.5 44 42.2 45.5 41.5 C 45.8 40 45.5 37 44.5 37 Z M 44 46 C 41.5 46 39.8 44.5 39.5 43.5 C 38.8 47 41.8 49 44.8 49 C 46.8 49 48.5 48.2 49.5 47.2 C 49.8 46.8 49.5 46.2 49 46.2 C 47.8 46.2 46 46 44 46 Z"/>
  </g>

  <!-- Iconic 4-point Diamond Star (matching the portfolio's signature stars) -->
  <path d="M 48 11 Q 48 16 53 16 Q 48 16 48 21 Q 48 16 43 16 Q 48 16 48 11 Z" fill="url(#gold)"/>
</svg>